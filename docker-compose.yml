version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: diskingressos_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-diskingressos}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-disk2026erp}
      POSTGRES_DB: ${DB_NAME:-diskingressos_erp}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-diskingressos} -d ${DB_NAME:-diskingressos_erp}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: diskingressos_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@diskingressos.com.br}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-disk2026pg}
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data:
